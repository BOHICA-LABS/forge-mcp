[package]
name = "forge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core MCP protocol client/server abstractions for Forge MCP (L1)"

[dependencies]
forge-config = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rmcp = { workspace = true }
tokio-util = { version = "0.7" }
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
jsonschema = { version = "0.45", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
forge-test-http-server = { path = "../../tests/forge-test-http-server" }
tokio = { workspace = true }
rmcp = { workspace = true }
tokio-util = { version = "0.7" }
tempfile = "3"
wiremock = "0.6"
proptest = "1"

[[test]]
name = "protocol_tests"
path = "tests/protocol_tests.rs"

[[test]]
name = "transport_tests"
path = "tests/transport_tests.rs"

[[test]]
name = "capability_tests"
path = "tests/capability_tests.rs"

[[test]]
name = "version_degradation_tests"
path = "tests/version_degradation_tests.rs"

[[test]]
name = "resource_tests"
path = "tests/resource_tests.rs"

[[test]]
name = "prompt_tests"
path = "tests/prompt_tests.rs"

[[test]]
name = "sampling_proxy_tests"
path = "tests/sampling_proxy_tests.rs"

[[test]]
name = "progress_cancel_tests"
path = "tests/progress_cancel_tests.rs"

[[test]]
name = "capture_tests"
path = "tests/capture_tests.rs"
