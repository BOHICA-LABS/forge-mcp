name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Check / Test / Lint matrix
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: CI (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-x64
            runner: macos-13
            target: x86_64-apple-darwin
          - os: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - os: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo check
        run: cargo check --workspace --target ${{ matrix.target }}

      - name: Build test servers
        run: cargo build -p forge-test-server -p forge-test-http-server --target ${{ matrix.target }}

      - name: cargo test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: cargo clippy
        run: cargo clippy --workspace --target ${{ matrix.target }} -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check
        # fmt doesn't depend on target, only run once to avoid duplicate failures
        if: matrix.os == 'linux-x64'

  # ───────────────────────────────────────────────────────────────────────────
  # Release build + binary size gate
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: forge-mcp
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: forge-mcp
          - os: macos-x64
            runner: macos-13
            target: x86_64-apple-darwin
            binary: forge-mcp
          - os: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: forge-mcp
          - os: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: forge-mcp.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release -p forge-mcp --target ${{ matrix.target }}

      - name: Verify binary exists and --help exits 0
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          echo "Binary path: $BINARY"
          ls -lh "$BINARY"
          "$BINARY" --help
          "$BINARY" --version

      - name: Check binary size < 25 MB
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          SIZE=$(wc -c < "$BINARY")
          MAX=$((25 * 1024 * 1024))
          echo "Binary size: $SIZE bytes (limit: $MAX bytes)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "ERROR: Binary exceeds 25 MB size limit!"
            exit 1
          fi
          echo "OK: Binary is within size limit."

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-mcp-${{ matrix.os }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 7
