[package]
name = "forge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core MCP protocol client/server abstractions for Forge MCP (L1)"

[dependencies]
forge-config = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rmcp = { workspace = true }
tokio-util = { version = "0.7" }
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
forge-test-http-server = { path = "../../tests/forge-test-http-server" }
tokio = { workspace = true }
rmcp = { workspace = true }
tokio-util = { version = "0.7" }
tempfile = "3"

[[test]]
name = "transport_tests"
path = "tests/transport_tests.rs"

[[test]]
name = "capability_tests"
path = "tests/capability_tests.rs"
